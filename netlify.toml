# Strip /demystifyingmaths/ prefix and serve from repo root
[[redirects]]
  from = "/demystifyingmaths/*"
  to = "/:splat"
  status = 200
  force = true

# Redirect domain root to /demystifyingmaths/
[[redirects]]
  from = "/"
  to = "/demystifyingmaths/"
  status = 301
  force = true

# Redirect bare page names at root to the pages/ folder
# e.g. /home -> /pages/home.html
[[redirects]]
  from = "/:page"
  to = "/pages/:page.html"
  status = 301
  force = false
